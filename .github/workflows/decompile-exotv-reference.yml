name: Decompile EXO TV reference APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target project
        uses: actions/checkout@v4
        with:
          path: target

      - name: Checkout original EXO TV reference
        uses: actions/checkout@v4
        with:
          repository: tombad8900/exotv-analysis-reference
          ref: main
          path: reference
          fetch-depth: 1
          token: ${{ secrets.REFERENCE_REPO_TOKEN }}

      - name: Install decompilers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip
          curl -fL --retry 3 -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          curl -fL --retry 3 -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.2/jadx-1.5.2.zip
          mkdir jadx
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx

      - name: Decode original APK with apktool and JADX
        shell: bash
        run: |
          set -euo pipefail
          test -s reference/installed-apk/base.apk
          mkdir -p extracted
          java -jar apktool.jar d -f reference/installed-apk/base.apk -o extracted/apktool
          jadx/bin/jadx -d extracted/jadx reference/installed-apk/base.apk
          cp reference/installed-apk/base.apk extracted/base.apk
          sha256sum extracted/base.apk > extracted/SHA256SUMS
          find extracted -maxdepth 2 -type d -print

      - name: Upload full decompilation
        uses: actions/upload-artifact@v4
        with:
          name: exotv-original-apk-decompiled
          path: extracted/
          if-no-files-found: error
          compression-level: 6
          retention-days: 13
